name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref so a fast follow-up push doesn't
# pile up green/old deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: bun run typecheck

      # Bun's test runner has a known segfault when spawning many child
      # processes back-to-back across mixed workspaces, so run packages /
      # CLI / web in separate steps. Each completes cleanly on its own.
      - name: Test packages/
        run: bun test packages/

      - name: Test apps/cli/
        run: bun test apps/cli/

      - name: Test apps/web/
        run: bun test apps/web/

  deploy:
    name: build + deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    # Don't try to deploy fork PRs: they don't have access to the
    # CLOUDFLARE_* secrets and the wrangler step would just fail. Internal
    # PRs and master pushes proceed normally.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write   # so wrangler can comment the preview URL on PRs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch` distinguishes prod from preview: pushes to master
          # land on the production branch, PR commits land on a per-branch
          # preview URL that wrangler echoes back as a PR comment.
          command: >-
            pages deploy apps/web/build
            --project-name=zigshape
            --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
